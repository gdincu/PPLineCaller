name: detection-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r requirements-test.txt
      - name: Resolve pinned python-for-android revision
        id: p4a
        run: |
          echo "revision=$(python -c 'import configparser; c = configparser.ConfigParser(); c.read("buildozer.spec"); print(c["app"]["p4a.commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: kivy/python-for-android
          ref: ${{ steps.p4a.outputs.revision }}
          path: .buildozer/android/platform/python-for-android
          persist-credentials: false
      - run: python -m unittest discover -s tests -v
        env:
          P4A_SOURCE_DIR: .buildozer/android/platform/python-for-android
