name: build-apk
on: [push, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let a cold build finish saving its cache before the next push restores it.
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: sudo apt-get update && sudo apt-get install -y openjdk-17-jdk unzip autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
      - run: python -m pip install -r requirements-android.txt
      - name: Prepare python-for-android with 16 KB alignment
        run: python tools/prepare_python_for_android.py
      - name: Identify Android build toolchain
        id: android-toolchain
        run: |
          python - <<'PY'
          import configparser
          import hashlib
          import os
          import platform
          from importlib.metadata import version

          config = configparser.ConfigParser()
          config.read("buildozer.spec")
          values = [os.environ["ImageOS"], platform.python_version(), version("buildozer"), version("Cython")]
          for key in ("android.api", "android.minapi", "android.build_tools", "android.ndk"):
              values.append(f"{key}={config['app'][key]}")
          fingerprint = "\n".join(values)
          print(fingerprint)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"fingerprint={hashlib.sha256(fingerprint.encode()).hexdigest()}", file=output)
              print(f"ndk_revision={config['app']['android.ndk']}", file=output)
          PY
      - name: Cache Android SDK, NDK, and Ant
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform
          # Hooks and recipes can change without downloading the toolchain again.
          # The NDK patch script is included so changed linker flags cannot be reused.
          key: buildozer-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.android-toolchain.outputs.fingerprint }}-${{ hashFiles('requirements-android.txt', 'tools/prepare-android-ndk.sh') }}
      - name: Cache Buildozer native outputs
        id: native-cache
        uses: actions/cache@v4
        with:
          # Keep the p4a checkout and app staging fresh. Cache native recipes,
          # distributions, and source downloads only.
          path: .buildozer/android/platform/build-*
          # Exact native-input matches only. Workflow upload/preview changes do
          # not invalidate compiled libraries; both alignment scripts still do.
          key: buildozer-native-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.android-toolchain.outputs.fingerprint }}-${{ hashFiles('buildozer.spec', 'requirements-android.txt', 'p4a-recipes/**', 'p4a-hook.py', 'tools/prepare-android-ndk.sh', 'tools/prepare_python_for_android.py') }}
      - name: Cache Gradle downloads
        id: gradle-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: buildozer-gradle-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('buildozer.spec', 'requirements-android.txt') }}
          # Gradle resolves dependency versions itself; reuse downloads even
          # when native settings change. Native binaries have no fallback key.
          restore-keys: |
            buildozer-gradle-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare NDK with 16 KB alignment
        run: |
          # CMake-built recipes (opencv, jpeg, libwebp) ignore p4a's LDFLAGS and
          # take linker flags from the NDK toolchain files.
          bash tools/prepare-android-ndk.sh "$NDK_REVISION"
        env:
          NDK_REVISION: ${{ steps.android-toolchain.outputs.ndk_revision }}
      - name: Build debug APK
        run: |
          set -o pipefail
          if [ "${NATIVE_CACHE_HIT:-false}" != "true" ]; then
            echo "::notice::Native cache miss: this build must compile native libraries. Later builds with the same native inputs can reuse them."
          fi
          start=$SECONDS
          buildozer android debug 2>&1 | tee buildozer.log
          elapsed=$((SECONDS - start))
          printf '### APK build\n\n- Toolchain cache hit: %s\n- Native cache hit: %s\n- Gradle cache hit: %s\n- Buildozer duration: %sm %ss\n' \
            "${TOOLCHAIN_CACHE_HIT:-false}" "${NATIVE_CACHE_HIT:-false}" "${GRADLE_CACHE_HIT:-false}" "$((elapsed / 60))" "$((elapsed % 60))" >> "$GITHUB_STEP_SUMMARY"
        env:
          ACCEPT_SDK_LICENSE: "yes"
          TOOLCHAIN_CACHE_HIT: ${{ steps.toolchain-cache.outputs.cache-hit }}
          NATIVE_CACHE_HIT: ${{ steps.native-cache.outputs.cache-hit }}
          GRADLE_CACHE_HIT: ${{ steps.gradle-cache.outputs.cache-hit }}
          PYTHONUNBUFFERED: "1"
      - name: Verify generated startup guard after Java compilation
        run: python -m unittest discover -s tests -p test_android_startup.py -v
        env:
          P4A_SOURCE_DIR: .buildozer/android/platform/python-for-android
          P4A_DIST_DIR: .buildozer/android/platform/build-arm64-v8a/dists/pplinecaller
      - name: Verify native ELF alignment and RELRO on 4 KB and 16 KB pages
        run: |
          set -o pipefail
          python tools/validate_android_elf.py bin/*.apk
      - run: |
          echo "=== bin ==="; ls -lhR bin 2>&1 || true
          echo "=== find apk/aab ==="; find . -maxdepth 5 -name "*.apk" -o -name "*.aab" | xargs ls -lh 2>&1 || true
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: buildozer-log, path: buildozer.log, if-no-files-found: warn}
      - name: Upload APK directly
        uses: actions/upload-artifact@v7
        if: success()
        with:
          path: bin/*.apk
          archive: false
          if-no-files-found: warn
